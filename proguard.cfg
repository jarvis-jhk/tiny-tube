# R8 configuration. The app has no reflection beyond what the framework does for
# components named in the manifest, so the keep list is just those seven.
-keep public class org.tinytube.app.App { public <init>(); }
-keep public class org.tinytube.app.Feed { public <init>(); }
-keep public class org.tinytube.app.Play { public <init>(); }
-keep public class org.tinytube.app.Search { public <init>(); }
-keep public class org.tinytube.app.Cacher { public <init>(); }
-keep public class org.tinytube.app.Refresh { public <init>(); }
-keep public class org.tinytube.app.Screen { public <init>(); }

# Line numbers are kept and names are obfuscated, with the mapping written to
# mapping.txt in the repo (committed with every build that ships). A logged
# trace reads "a.c(SourceFile:412)"; tools/retrace.sh turns it back into
# Source.openRange(Source.java:412). Obfuscation is worth ~6 KB unsigned;
# R8 --release drops the line tables unless told otherwise.
-keepattributes SourceFile,LineNumberTable
-renamesourcefileattribute SourceFile
-printmapping mapping.txt

-dontwarn android.**
-dontwarn java.**
